<h1 class="詩題">遊龍門奉先寺</h1>
<p class="題解">龍門卽伊闕。《元和郡縣志》：伊闕山在河南府伊闕縣北，非《禹貢》之龍門。</p>

<table>
<tbody>
<tr class="行間"><td colspan="2"></td></tr>
<tr>
<td class="眉批">李子德云：氣體高妙，澹然自足。</td>
<td class="詩文">已從招提遊。更宿招提境。<span class="旁注">題是遊詩只寫宿。</span><span class="注釋">《僧輝記》：招提者，梵言拓鬭提奢，唐言四方僧物，傳筆者訛拓爲招，去鬭奢字。卽今十方住持是也。《唐會要》：官賜額爲寺，私造者爲招提蘭若。</span>陰壑生虛<span class="異文">一作靈。</span>籟。<span class="注釋">虛籟謂風也。莊子有天籟、地籟、人籟。</span>月林散清影。天闚<span class="異文">一作闕。一作閱。</span>象緯逼。雲臥衣裳冷。<span class="注釋">古效切。</span>欲覺<span class="異文">古效切。</span>聞晨鐘。令人發深省。<span class="注釋">王嗣奭曰：人在塵溷中終日碌碌，一當靜境，不覺萬慮皆空。結語具有解悟。</span></td>
</tr>
